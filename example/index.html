<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Damerau-Levenshtein — spelling suggestions</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 34rem;
        margin: 3rem auto;
        padding: 0 1rem;
        line-height: 1.5;
      }
      input {
        font: inherit;
        width: 100%;
        padding: 0.5rem;
        box-sizing: border-box;
      }
      ol {
        padding-left: 1.25rem;
      }
      .distance {
        color: #666;
        font-variant-numeric: tabular-nums;
      }
    </style>
  </head>
  <body>
    <h1>Spelling suggestions</h1>
    <p>
      Type a fruit name — misspell it on purpose — and the dictionary is ranked by
      Damerau-Levenshtein distance.
    </p>

    <label for="query">Search</label>
    <input id="query" type="text" value="aplpe" autocomplete="off" />

    <ol id="suggestions"></ol>

    <!--
      Run `npm run build` first, then serve the repository root, e.g.:
        npx serve .
      and open /example/ in a browser. Opening this file over file:// will not
      work: ES modules require http(s).
    -->
    <script type="module">
      import { DamerauLevenshtein } from "../dist/index.js";

      const dl = new DamerauLevenshtein();
      const dictionary = [
        "apple",
        "banana",
        "orange",
        "pear",
        "peach",
        "pineapple",
        "plum",
        "strawberry",
      ];

      const query = document.querySelector("#query");
      const suggestions = document.querySelector("#suggestions");

      function render() {
        const term = query.value.trim().toLowerCase();

        suggestions.replaceChildren(
          ...dictionary
            .map((word) => ({ word, score: dl.distance(term, word) }))
            .sort((a, b) => a.score - b.score || a.word.localeCompare(b.word))
            .slice(0, 5)
            .map(({ word, score }) => {
              const item = document.createElement("li");
              item.textContent = `${word} `;

              const badge = document.createElement("span");
              badge.className = "distance";
              badge.textContent = `(distance ${score})`;
              item.append(badge);

              return item;
            }),
        );
      }

      query.addEventListener("input", render);
      render();
    </script>
  </body>
</html>
