name: Update Changelog

on:
  release:
    types: [released]

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: main

      # Only write to the changelog for a release that is actually shippable.
      # Two ways this is skipped:
      #  - the tag disagrees with package.json, i.e. the release is mistagged
      #    and the publish workflow will refuse it anyway;
      #  - the version is already documented by hand, which always wins. The
      #    action does its own check, but only by prefix-matching the release
      #    name, so `v2.0.0` against a `## 2.0.0` heading would slip through.
      - name: Decide whether to touch the changelog
        id: release
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          VERSION="${VERSION#v}"
          PKG="$(node -p "require('./package.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          if [ "$VERSION" != "$PKG" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::warning::Release tag ${VERSION} does not match package.json (${PKG}); leaving CHANGELOG.md alone."
          elif grep -q "^## ${VERSION} " CHANGELOG.md || grep -q "^## ${VERSION}$" CHANGELOG.md; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "CHANGELOG.md already documents ${VERSION}; leaving it alone."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Update Changelog
        if: steps.release.outputs.skip == 'false'
        uses: stefanzweifel/changelog-updater-action@v1
        with:
          latest-version: ${{ steps.release.outputs.version }}
          release-notes: ${{ github.event.release.body }}

      - name: Commit updated CHANGELOG
        if: steps.release.outputs.skip == 'false'
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          branch: main
          commit_message: "docs: update CHANGELOG"
          file_pattern: CHANGELOG.md
