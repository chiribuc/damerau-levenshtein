name: Publish

on:
  release:
    types: [published]
  # Manual escape hatch: editing a release only emits `edited`, so a release
  # whose tag was fixed after the fact never re-fires `published`. Dispatch this
  # workflow against the tag instead of deleting and re-creating the release.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish, e.g. 2.0.0"
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Required for npm provenance attestations.
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org/

      - run: npm ci

      # The tarball ships built output only, so a broken build must never reach
      # the registry: verify everything before publishing.
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run lint:package

      - name: Verify the tag matches package.json
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          TAG="${TAG#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "Release tag ($TAG) does not match package.json version ($PKG)." >&2
            echo "Fix package.json on main and re-tag, or dispatch this workflow against the right tag." >&2
            exit 1
          fi
          echo "Publishing $PKG from tag $TAG."

      # `--provenance` lives here rather than in publishConfig so that manual
      # publishes from a laptop (where provenance cannot be generated) still work.
      #
      # Works with either credential scheme:
      #  - NPM_TOKEN secret set  -> classic token auth;
      #  - secret absent         -> npm trusted publishing over OIDC, which needs
      #                             npm >= 11.5.1 (bundled with Node 24).
      # setup-node always writes an `_authToken` line into the generated .npmrc;
      # left empty it breaks OIDC auth, so strip it when there is no token.
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ] && [ -n "$NPM_CONFIG_USERCONFIG" ]; then
            echo "No NPM_TOKEN set; relying on trusted publishing (npm $(npm --version))."
            sed -i '/_authToken/d' "$NPM_CONFIG_USERCONFIG"
          fi
          npm publish --provenance
